# =============================================================
# 해상 항로 리스크 조기경보 시스템 - 가중치 / 기준점 설정
# -------------------------------------------------------------
# 출처가 적힌 값 외에는 모두 "가정값"입니다. 운영 전에 검토·조정하세요.
# 값을 바꾼 뒤에는 앱을 다시 시작해야 반영됩니다.
# API 키와 SMTP 정보는 이 파일이 아니라 .env 에 넣습니다 (.env.example 참고).
# =============================================================

[schedule]
# 기상 수집 + 위험 계산 + 알림 판정 주기 (분)
risk_interval_minutes = 60
# 뉴스 수집 주기 (분). NewsAPI Developer(무료) 요금제는 하루 100회 요청 제한이 있고,
# 이 앱은 해협 1곳당 3회 호출하므로 5개 해협 × 3회 = 1회 수집당 15회 → 4시간 간격이면 하루 90회.
news_interval_minutes = 240
# AIS 수집(collector.py) 주기 (분)와 1회 수집 시간 (초). AISSTREAM_API_KEY 가 없으면 실행하지 않음
ais_enabled = true
ais_interval_minutes = 60
ais_collect_seconds = 120

# -------------------------------------------------------------
# 규칙 점수 (0~100) - 지표별 최대 기여 점수. [가정값]
# 각 지표를 0~1 로 정규화한 뒤 아래 점수를 곱해 더함.
# -------------------------------------------------------------
[score]
news_volume = 30     # 뉴스 건수 (해협별 30일 평균 대비 상대값, 강한 키워드 가중)
news_growth = 15     # 뉴스 증가율 (최근 7일 vs 직전 7일)
weather = 20         # 기상 위협 (파고·풍속)
geopolitical = 35    # 지정학 위협 지수 (1~5)
# AIS 통항량 감소: 무료 AIS 2분 표본으로는 해협 안 선박이 0~수 척이라 신뢰할 수 없어 비활성(0점).
# 수집 기록은 계속 쌓이므로, 데이터가 충분해지면 점수를 주고 다른 항목을 줄여 합을 100으로 맞추면 됨
ais_drop = 0

[thresholds]
# 판정 기준점 [가정값]: 점수 >= warning 이면 경고, >= critical 이면 심각
warning = 40
critical = 65

# -------------------------------------------------------------
# 뉴스 지표
# -------------------------------------------------------------
[news]
# 상대값(최근 7일 일평균 × 키워드 가중 ÷ 최근 30일 일평균)이 1.0 이하면 0점,
# volume_full_ratio 이상이면 만점 [가정값]
volume_full_ratio = 3.0
# 증가율이 0% 이하면 0점, growth_full_pct 이상이면 만점 [가정값]
growth_full_pct = 100
# 강한 키워드가 들어간 기사 1건의 가중치 (일반 기사 = 1.0) [가정값]
strong_keyword_weight = 3.0
# 강한 키워드 (영문 기사 제목+요약에서 검색, 소문자 부분일치)
strong_keywords = [
    "blockade", "blockaded", "attack", "attacked", "seize", "seized", "seizure",
    "hijack", "sanction", "missile", "drone strike", "mine", "closure", "closed",
]
# 지정학 위협 지수 추천값: 최근 7일 표본 중 강한 키워드 기사 비율의 경계값 [가정값]
# 비율 < 0.05 → 1, < 0.15 → 2, < 0.30 → 3, < 0.50 → 4, 그 이상 → 5
geo_share_bounds = [0.05, 0.15, 0.30, 0.50]
# 브리핑/메일에 표시할 주요 기사 수
top_articles = 5

# 브리핑용 이슈 유형 키워드 (점수에는 쓰이지 않음, 표시용)
[news.issue_keywords]
"공격/충돌" = ["attack", "strike", "clash", "military", "missile"]
"봉쇄/나포" = ["seize", "blockade", "capture", "hijack", "closure"]
"제재" = ["sanction", "embargo"]
"기상 악화" = ["storm", "typhoon", "hurricane", "cyclone", "ice"]
"지연/정체" = ["delay", "congestion", "backlog", "queue", "drought"]

# -------------------------------------------------------------
# 기상 지표 (Open-Meteo Marine API 파고 + Open-Meteo Forecast API 풍속)
# 경계값 근거:
#   파고 - WMO 해상상태 코드: 5(rough) 2.5~4 m, 6(very rough) 4~6 m, 7(high) 6~9 m
#   풍속 - 보퍼트 풍력계급: 6(strong breeze) 22~27 kn, 8(gale) 34~40 kn, 10(storm) 48~55 kn
# 경계값 자체는 위 공개 기준이지만, 이를 "0점 시작 / 만점"으로 쓰는 방식은 [가정값]
# -------------------------------------------------------------
[weather]
wave_start_m = 2.5
wave_full_m = 6.0
wind_start_kn = 22
wind_full_kn = 48
forecast_hours = 48   # 지금부터 앞으로 몇 시간 예보의 최댓값을 볼지

# -------------------------------------------------------------
# AIS 지표 (해협 구역 안 선박 수 / 평균 속도가 평소보다 줄었는지)
# -------------------------------------------------------------
[ais]
drop_start_ratio = 0.7      # 평소(30일 평균)의 70% 미만이면 점수 시작 [가정값]
drop_full_ratio = 0.3       # 30% 이하이면 만점 [가정값]
min_history = 5             # 평소값 계산에 필요한 최소 기록 수 [가정값]
max_snapshot_age_hours = 3  # ship_data.json 이 이보다 오래됐으면 사용하지 않음

# -------------------------------------------------------------
# 알림
# -------------------------------------------------------------
[alerts]
# 같은 해협에 대해 이 시간 안에는 같은 등급 이하 알림을 다시 보내지 않음 [가정값]
# (더 높은 등급으로 올라간 경우에는 대기 시간과 관계없이 발송)
cooldown_hours = 6
# 해협 등급이 오를 때 ALERT_RECIPIENTS 에게 보내는 '해협 단위' 메일. 등록한 운항별 경고와 겹치므로 기본은 끔
strait_alerts = false

[trend]
min_points = 3   # 이보다 기록이 적으면 추이 그래프 대신 '데이터 수집 중' 표시
days = 30

# -------------------------------------------------------------
# 대안 항로 비용 계산
# speed_kn: 항해 일수 = 경로 거리(해리) ÷ (속력 × 24)
# 아래 비용 기본값은 모두 [가정값]이며, 화면에서 입력·저장하면 저장값이 우선합니다.
# war_risk_pct: 선체가액 대비 전쟁위험 보험료율(%) / extra_usd: 운하 통항료·파이프라인 이용료·철도비 등
# -------------------------------------------------------------
[scenario.hormuz]
speed_kn = 13             # [가정값] VLCC 만재 운항 속력
charter_usd_day = 50000   # [가정값]
fuel_usd_t = 600          # [가정값]
fuel_t_day = 60           # [가정값]
hull_value_usd = 100000000  # [가정값]
[scenario.hormuz.options]
hormuz_base   = { war_risk_pct = 0.5, extra_usd = 0 }   # [가정값]
hormuz_yanbu  = { war_risk_pct = 0.3, extra_usd = 0 }   # [가정값] 파이프라인 이용료 미반영
hormuz_fujairah = { war_risk_pct = 0.2, extra_usd = 0 } # [가정값] 파이프라인 이용료 미반영
hormuz_switch = { war_risk_pct = 0.0, extra_usd = 0 }   # [가정값] 원유 가격 차이 미반영

[scenario.suez]
speed_kn = 16             # Port Economics(Notteboom·Rodrigue)의 아시아-유럽 비교가 16노트 기준
charter_usd_day = 40000   # [가정값]
fuel_usd_t = 600          # [가정값]
fuel_t_day = 100          # [가정값]
hull_value_usd = 100000000  # [가정값]
[scenario.suez.options]
suez_base = { war_risk_pct = 0.7, extra_usd = 500000 }  # [가정값] 수에즈 통항료 포함 가정
suez_cape = { war_risk_pct = 0.0, extra_usd = 0 }       # [가정값]

[scenario.malacca]
speed_kn = 16             # [가정값]
charter_usd_day = 40000   # [가정값]
fuel_usd_t = 600          # [가정값]
fuel_t_day = 100          # [가정값]
hull_value_usd = 100000000  # [가정값]
[scenario.malacca.options]
malacca_base   = { war_risk_pct = 0.0, extra_usd = 0 }  # [가정값]
malacca_sunda  = { war_risk_pct = 0.0, extra_usd = 0 }  # [가정값]
malacca_lombok = { war_risk_pct = 0.0, extra_usd = 0 }  # [가정값]

[scenario.panama]
speed_kn = 16             # [가정값]
charter_usd_day = 40000   # [가정값]
fuel_usd_t = 600          # [가정값]
fuel_t_day = 100          # [가정값]
hull_value_usd = 100000000  # [가정값]
[scenario.panama.options]
panama_base = { war_risk_pct = 0.0, extra_usd = 500000 }  # [가정값] 파나마 통항료 포함 가정
panama_suez = { war_risk_pct = 0.7, extra_usd = 500000 }  # [가정값] 수에즈 통항료 포함 가정
panama_rail = { war_risk_pct = 0.0, extra_usd = 0 }       # [가정값] 철도 운송비 미반영 → 화면에서 입력

[scenario.arctic]
speed_kn = 10             # [가정값] 해빙 구간 감속
charter_usd_day = 40000   # [가정값]
fuel_usd_t = 600          # [가정값]
fuel_t_day = 80           # [가정값]
hull_value_usd = 100000000  # [가정값]
[scenario.arctic.options]
arctic_base = { war_risk_pct = 0.0, extra_usd = 0 }       # [가정값] 쇄빙선 지원료 미반영
arctic_suez = { war_risk_pct = 0.7, extra_usd = 500000 }  # [가정값]

# -------------------------------------------------------------
# 운항 감시 (등록한 선박의 출발항 → 도착항 전체 경로)
# -------------------------------------------------------------
[voyage]
default_speed_kn = 14        # [가정값] 등록 시 속력을 비워 두면 사용
sample_step_nm = 250         # 남은 경로를 이 간격으로 나눠 기상 예보 확인
forecast_hours = 192         # Open-Meteo 예보 범위(8일) 안의 지점만 확인
position_max_age_hours = 48  # 이보다 오래된 AIS 위치는 '현재 위치'로 쓰지 않음
tracked_collect_seconds = 90 # 등록 선박만 따로 AIS 구독하는 시간
# 경로상 기상 판정 경계. 값은 공개 기준(WMO 해상상태 코드 6 very rough 4 m~, 7 high 6 m~ /
# 보퍼트 8 gale 34 kn~, 10 storm 48 kn~)이고, 이를 경고·심각에 대응시킨 것은 [가정값]
wave_warning_m = 4.0
wave_critical_m = 6.0
wind_warning_kn = 34
wind_critical_kn = 48
# 기상 위험 시 '진입 시각 늦추기' 효과를 계산할 지연 시간 후보 (시간)
delay_options_hours = [12, 24, 36, 48, 72]
# 대체 노선은 현재 경로보다 이 배수 이상 길면 제시하지 않음 [가정값]
max_detour_ratio = 2.0
