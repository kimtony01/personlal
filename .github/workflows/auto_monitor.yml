name: 해상 항로 조기경보 (수집·판단·경보)

on:
  schedule:
    # 30분마다 (GitHub 사정에 따라 몇 분~수십 분 늦게 시작될 수 있음)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

# 이전 실행이 끝나기 전에 다음 실행이 겹치지 않게 (메일 중복 방지)
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitor.txt

      - run: pip install -r requirements-monitor.txt

      # 결과는 DB(Neon)에 저장 — 저장소에 커밋하지 않음
      - name: 수집 → 해협 신호등 판단 → 운항 감시 → 경보 메일
        run: python monitor.py
        env:
          TZ: Asia/Seoul
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SMTP_USER: ${{ secrets.GMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_EMAIL }}
