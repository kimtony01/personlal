name: Blue Ocean Finder 깨워 두기 (Render 잠들기 방지)

on:
  schedule:
    # 10분마다 (Render 무료는 15분 동안 방문이 없으면 앱을 재움)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Render는 주소 접속만으로도 방문으로 침 → curl 한 번이면 충분 (잠들어 있으면 깨는 데 1분쯤 걸림)
      - name: 사이트 접속
        run: curl -sS -o /dev/null -w "응답 %{http_code} · %{time_total}초\n" --max-time 180 https://project1-vo8c.onrender.com/
