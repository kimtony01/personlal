# 공식 판단 — 자동으로 가져올 수 없어 직접 관리하는 표
# 새 발표가 나오면 해당 해협의 값과 date 를 고치고 커밋하세요. date 가 오래되면 화면에 '갱신 필요'로 표시됩니다.
#
# msci_level : 미국 MARAD MSCI  ""(없음) / "advisory"(일반 주의) / "alert"(구체적 위협)
#              https://www.maritime.dot.gov/msci
# jmic_level : JMIC/UKMTO 위협 등급 그대로 (예: "low", "moderate", "substantial", "high", "severe", "critical")
#              https://www.ukmto.org/partner-products/jmic-products
# jwc_listed : Lloyd's JWC 전쟁위험 지정 해역 여부.  jwc_since 가 최근 30일 안이면 '신규 지정'으로 주의
#
# 값을 확인하지 못한 칸은 비워 두었습니다(판단에 쓰지 않음).

